<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GrabX</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="shell">
    <header class="header">
      <span class="brand-mark">GX</span>
      <span class="heading">
        <strong>GrabX</strong>
        <small>Download Assistant</small>
      </span>
      <span id="count" class="count">0</span>
    </header>

    <label class="interception">
      <span class="interception-copy">
        <strong>Send downloads to GrabX</strong>
        <small>Automatically catch downloads from this browser</small>
      </span>
      <input id="interceptDownloads" type="checkbox" role="switch">
      <span class="switch" aria-hidden="true"></span>
    </label>

    <section id="loading" class="state">
      <span class="scanner"></span>
      <strong>Scanning this page</strong>
      <small>Looking for media and downloadable files…</small>
    </section>

    <section id="empty" class="state hidden">
      <span class="empty-icon" aria-hidden="true">↓</span>
      <strong>No media found</strong>
      <small>Open a video page or right-click a download link.</small>
    </section>

    <section id="results" class="results hidden" aria-live="polite"></section>
    <button id="manageQueue" class="queue-toggle" type="button" aria-expanded="false" aria-controls="queuePanel">
      <span>Waiting list <span id="queueCount" class="queue-count">0</span></span><span id="queueChevron" aria-hidden="true">▾</span>
    </button>
    <section id="queuePanel" class="queue-panel hidden" aria-label="Waiting downloads">
      <p id="queueStatus" class="queue-help hidden" role="status"></p>
      <p id="message" class="queue-message" role="status"></p>
      <div id="items" class="queue-items"></div>
      <button id="refresh" class="queue-refresh" type="button">Refresh</button>
    </section>
    <p id="notice" class="notice hidden" role="status"></p>
  </main>
  <script src="popup.js"></script>
  <script src="queue-state.js"></script>
  <script src="queue.js"></script>
</body>
</html>
