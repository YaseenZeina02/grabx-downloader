name: Windows x64 installer
on:
  push:
    branches: [codex/windows-x64-installer]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and test Windows application and setup
        env:
          GRABX_TEST_SETUP: 'true'
        run: .\gradlew.bat test installDist
      - name: Verify extension and pinned tool validation
        shell: bash
        run: |
          node --test browser-extension/tests/*.test.cjs
          python -m unittest discover -s scripts/tests -p test_windows_tools.py -v
      - name: Collect actual Windows setup previews
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/windows-package/previews | Out-Null
          Copy-Item "$env:TEMP/grabx-setup-*.png" build/windows-package/previews
      - name: Prepare complete verified Windows x64 tools
        run: python scripts/prepare-windows-tools.py
      - name: Locate WiX 3
        shell: pwsh
        run: |
          $wix = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter "WiX Toolset v3*" -ErrorAction SilentlyContinue | Where-Object { Test-Path (Join-Path $_.FullName "bin/candle.exe") } | Select-Object -First 1
          if (-not $wix) {
            choco install wixtoolset --version=3.14.1 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
            $wix = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter "WiX Toolset v3*" | Where-Object { Test-Path (Join-Path $_.FullName "bin/candle.exe") } | Select-Object -First 1
          }
          if (-not $wix) { throw 'WiX 3 not found' }
          (Join-Path $wix.FullName "bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build self-contained application image
        run: python scripts/package-app.py --version 1.0.4 --type app-image --tools build/windows-tools --skip-build --dest build/windows-package/image
      - name: Build branded EXE and MSI installers
        shell: pwsh
        run: |
          $common = @('--name', 'GrabX', '--app-version', '1.0.4', '--vendor', 'GrabX', '--app-image', 'build/windows-package/image/GrabX', '--dest', 'build/windows-package/installers', '--icon', 'src/main/resources/com/grabx/app/grabx/icons/grabx-setup.ico', '--win-per-user-install', '--win-dir-chooser', '--win-menu', '--win-shortcut', '--win-menu-group', 'GrabX', '--win-upgrade-uuid', '2d05d6ea-9272-4ba2-a5d4-26960fa16fd3')
          & "$env:JAVA_HOME/bin/jpackage.exe" @common --type msi
          if ($LASTEXITCODE -ne 0) { throw 'MSI packaging failed' }
          & "$env:JAVA_HOME/bin/jpackage.exe" @common --type exe
          if ($LASTEXITCODE -ne 0) { throw 'EXE packaging failed' }
      - name: Install MSI, verify clean-user runtime and browser registration, uninstall
        shell: pwsh
        run: |
          $msi = (Get-ChildItem build/windows-package/installers/*.msi | Select-Object -First 1).FullName
          $target = Join-Path $env:LOCALAPPDATA 'GrabX Installer Test'
          $log = Join-Path $env:GITHUB_WORKSPACE 'build/windows-package/install.log'
          $installation = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart INSTALLDIR=`"$target`" /L*v `"$log`"" -Wait -PassThru
          if ($installation.ExitCode -notin @(0, 3010)) { throw "MSI install failed: $($installation.ExitCode)" }
          if (-not (Test-Path "$target/GrabX.exe")) { throw "Installed launcher missing: $target" }
          python scripts/smoke-packaged-app.py "$target" --windows-register
          if ($LASTEXITCODE -ne 0) { throw 'Packaged application smoke failed' }
          $removal = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /norestart" -Wait -PassThru
          if ($removal.ExitCode -notin @(0, 3010)) { throw "MSI uninstall failed: $($removal.ExitCode)" }
          if (Test-Path "$target/GrabX.exe") { throw 'Uninstall left the application launcher behind' }
      - name: Prepare friend handoff with checksums
        shell: pwsh
        run: |
          Copy-Item build/windows-package/image/build-info.json build/windows-package/installers/build-info.json
          Copy-Item packaging/windows/START-HERE-ar.txt build/windows-package/installers/START-HERE-ar.txt
          Get-ChildItem build/windows-package/installers/* -Include *.exe,*.msi | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Out-File build/windows-package/installers/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: GrabX-1.0.4-windows-x64
          path: build/windows-package/installers/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer-diagnostics
          path: |
            build/reports/tests/test
            build/test-results/test
            build/windows-package/*.log
            build/windows-package/previews
            build/packaging/Windows-*/**/*.log
          retention-days: 7
