name: Platform builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enable bundled-tool integration tests
        run: python scripts/ci-tool-path.py
      - name: Build and unit tests (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat test installDist distZip
      - name: Build and unit tests (Unix)
        if: runner.os != 'Windows'
        run: chmod +x gradlew && ./gradlew test installDist distZip
      - name: Extension tests
        shell: bash
        run: node --test browser-extension/tests/*.test.cjs
      - name: Native protocol smoke check
        run: python scripts/smoke-distribution.py build/install/GrabX
      - name: Linux installer tests
        if: runner.os != 'Windows'
        run: python -m unittest discover -s scripts/tests -v
      - name: Register and check Linux wrapper
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python browser-extension/native-host/install-linux.py aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa build/install/GrabX
          python scripts/smoke-distribution.py build/install/GrabX --launcher "$HOME/.local/share/GrabX/browser-bridge/grabx-native-host"
      - name: Register and check Windows wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./browser-extension/native-host/install-windows.ps1 -ExtensionId aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa -NativeHostPath ./build/install/GrabX/bin/grabx-native-host.bat -JavaHome $env:JAVA_HOME
          python scripts/smoke-distribution.py build/install/GrabX --launcher "$env:LOCALAPPDATA/GrabX/browser-bridge/grabx-native-host.cmd"
      - name: Save platform distribution
        uses: actions/upload-artifact@v4
        with:
          name: GrabX-${{ runner.os }}-${{ runner.arch }}
          path: build/distributions/*.zip
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ runner.os }}
          path: build/reports/tests/test
